# ---------------------------------------------------------------------------
# Bog orchid (Hammarbya paludosa) habitat suitability model - Dartmoor
#
# This file IS the model. Every hard filter, weight and response curve lives
# here so the logic can be read and re-tuned by an ecologist without touching
# Python. Each entry carries a `notes` field recording the ecological reason for
# it, so a later reader can tell an evidence-based choice from a guess.
#
# Re-tune, re-run, compare the calibration report. Nothing is hidden in code.
# ---------------------------------------------------------------------------

project:
  crs: "EPSG:27700"
  # Working resolution. 10 m is chosen to match the practical ceiling set by the
  # England Peat Map and BGS geology rather than the 1 m LIDAR - see README.
  # Check each layer's native resolution with `preflight` before changing this.
  resolution_m: 10
  # Dartmoor National Park approximate bounding box (EPSG:27700). Used only as a
  # fallback / for the demo; the real run clips to the boundary polygon.
  study_area_bbox: [248000.0, 52000.0, 284000.0, 98000.0]

# ---------------------------------------------------------------------------
# Known occurrence records.
#
# `use_for_calibration` governs whether a record is used to sanity-check the
# score distribution and to derive the empirical elevation band. Records coarser
# than roughly the working resolution, or old enough that the habitat may have
# changed, are carried here for context and for the exclusion buffer but are NOT
# used to calibrate - a 1 km square cannot tell you which pixel was right.
# ---------------------------------------------------------------------------
known_sites:
  - name: "Raybarrow Pool area"
    grid_ref: "SX 64524 90050"
    precision_m: 10
    last_seen: null
    source: "Supplied by project lead."
    use_for_calibration: true
    notes: >
      Northern Dartmoor valley mire complex. Note this falls ~50 m north of the
      SX68/SX69 hectad line, while A New Flora of Devon places both extant
      Dartmoor sites in SX68; the discrepancy is immaterial at this resolution
      but is worth confirming against the original record card.

  - name: "Steeperton Brook"
    grid_ref: "SX 62406 89005"
    precision_m: 10
    last_seen: 1998
    source: "Supplied by project lead."
    use_for_calibration: true
    notes: >
      Matches the A New Flora of Devon record "Steeperton Brook, SX625889"
      (N. Baldock 1984; six plants 1997, five 1998, W.H. Tucker) to within
      ~155 m, so the two are taken to be the same locality.

  - name: "Unnamed SX68 site (annual monitoring 1994-2012)"
    grid_ref: "SX 6 8"          # the hectad SX68: E 260-270 km, N 80-90 km
    precision_m: 10000
    last_seen: 2012
    source: >
      A New Flora of Devon - recorded annually from 1994, max 25 plants in 2000
      "scattered over more than one flush" (R.D. Hutchings & R. Avery); five
      plants 2009 (N. Baldock); six plants 2011 and 2012 (R.E.N. Smith).
    use_for_calibration: false
    notes: >
      IMPORTANT: this is a real, recently-monitored population that the project
      brief did not list, but the only published locality is the 10 km square
      SX68, which is far too coarse to calibrate against or to exclude from the
      candidate list. The grid ref here is the centre of SX68 and is a
      PLACEHOLDER. Obtain the precise reference from the BSBI Distribution
      Database or the Devon Biodiversity Records Centre and replace it - it is
      the single highest-value input still missing from this model.

  - name: "Webburn Valley below Blackaton Tor (historic)"
    grid_ref: "SX 69 78"
    precision_m: 1000
    last_seen: 1938
    source: "A New Flora of Devon - two plants, 1938, L.A. Harvey."
    use_for_calibration: false
    notes: >
      Historic and almost certainly lost, and at 1 km precision. Retained
      because an eastern-Dartmoor record widens the habitat envelope the model
      should be willing to consider, and because the site is worth re-checking
      in the field.

# ---------------------------------------------------------------------------
# Hard filters. Failing any of these sets suitability to 0 (no-data), not to a
# low score. Keep this list short - each one throws ground away permanently.
# ---------------------------------------------------------------------------
hard_filters:
  priority_habitat:
    enabled: true
    layer: priority_habitat
    # Matched case-insensitively as substrings of the PHI main habitat field.
    include:
      - "Blanket Bog"
      - "Upland Flushes, Fens and Swamps"
    # PHI polygon edges are generalised from OS MasterMap and do not follow the
    # true mire margin. A buffer avoids discarding flush heads that sit just
    # outside a polygon - exactly where this species tends to be.
    buffer_m: 50
    notes: >
      Step 1 of the brief: bound the search to mire and flush polygons. This
      removes the large majority of the moor immediately.

  peat_present:
    enabled: true
    layer: peat_depth
    min_depth_cm: 10
    notes: >
      BSBI: acidic, extremely infertile peat. Treated as a hard requirement.
      10 cm is a deliberately permissive threshold - it excludes mineral ground
      without excluding the thin peats at flush margins.

# ---------------------------------------------------------------------------
# Weighted variables. Weights are relative; they are renormalised to sum to 1
# across whichever variables actually have data available at run time, and the
# renormalisation is reported so you can see what a missing layer did.
# ---------------------------------------------------------------------------
variables:

  sphagnum:
    weight: 0.25
    layer: sphagnum_flag
    curve: {type: boolean, true_score: 1.0, false_score: 0.25}
    notes: >
      STRONG. BSBI: typically on the margins of Sphagnum hummocks. Non-Sphagnum
      peat scores 0.25 rather than 0, because the species also occurs on open
      moist peat and because the peat map's vegetation classification is
      modelled, not surveyed - a hard zero would trust it further than it
      deserves.

  lateral_flow:
    weight: 0.30
    # The single most important variable: the brief's explicit lateral-flow
    # proxy. Two components multiplied, so BOTH must hold - throughflow needs
    # water arriving AND a gradient to keep it moving.
    combine: product
    components:
      flow_accumulation:
        layer: flow_accumulation_log10
        curve: {type: trapezoid, a: 1.0, b: 1.8, c: 3.3, d: 4.3}
        notes: >
          log10 of upslope cell count. Rises from ~10 cells (too little water to
          sustain a flush) and falls away above ~2000 cells, by which point the
          feature is a stream channel rather than a flush.
      slope:
        layer: slope_deg
        curve: {type: trapezoid, a: 0.3, b: 1.0, c: 5.0, d: 12.0}
        notes: >
          Degrees. Zero slope means pooling, not throughflow, so flat ground is
          penalised; above ~12 degrees water moves too fast and peat does not
          hold. The 1-5 degree plateau is the classic Dartmoor valley-mire and
          flush gradient.
    notes: >
      STRONG. BSBI: "boggy ground with lateral flow of water", explicitly not
      standing water. Deliberately used in preference to TWI alone, which
      flags flat pooling hollows.

  wetness:
    weight: 0.15
    layer: twi
    curve: {type: trapezoid, a: 4.0, b: 6.5, c: 9.5, d: 13.0}
    notes: >
      STRONG, and deliberately mid-range. Topographic wetness index. The species
      sits on hummock margins and moist peat, NOT in the wettest pools, so peak
      TWI must not score as most suitable. The upper shoulder is the important
      half of this curve.

  watercourse_proximity:
    weight: 0.15
    layer: distance_to_water_m
    curve: {type: trapezoid, a: 0.0, b: 15.0, c: 150.0, d: 600.0}
    notes: >
      MODERATE. Distance in metres to the OS Open Rivers network. Near-but-not-
      on: the first 15 m rise encodes that the channel itself is open water, not
      flush. Set `a: -1, b: -1` to make this a plain proximity decay if you
      disagree with that shoulder.

  geology:
    weight: 0.05
    layer: base_richness
    # 0 = unknown, 1 = acidic, 2 = intermediate/neutral, 3 = base-rich
    curve: {type: categorical, mapping: {0: 0.7, 1: 0.75, 2: 0.9, 3: 1.0}, default: 0.7}
    notes: >
      MINOR, and deliberately a soft weight rather than a filter. BSBI: acidic,
      extremely infertile peat, but occasionally moderately base-rich flushes.
      Acid ground therefore still scores well (0.75); base-rich gets a small
      lift. On Dartmoor granite almost everything will be class 1, so this
      variable will mostly do nothing - which is the intended behaviour.

  elevation:
    weight: 0.10
    layer: elevation_m
    # Derived empirically at run time from the calibration sites - see
    # `calibration.elevation` below. Any curve set here is used only if
    # `derive_from_sites` is false.
    curve: {type: trapezoid, a: 200.0, b: 300.0, c: 500.0, d: 600.0}
    notes: >
      MINOR. The c.500 m British maximum is not Dartmoor-specific, so the band
      is derived from the known sites instead. Weight kept low precisely because
      two points cannot define an elevation preference - this variable exists to
      damp implausible extremes, not to drive the result.

  nvc:
    weight: 0.25
    enabled: false        # set true only if real NVC survey data is supplied
    layer: nvc_m1_m21
    curve: {type: boolean, true_score: 1.0, false_score: 0.4}
    notes: >
      STRONG if available. Direct match to M1 (Sphagnum auriculatum bog pool) or
      M21 (Narthecium ossifragum-Sphagnum papillosum valley mire). Not confirmed
      to exist for Dartmoor in accessible form - enquire with Natural England /
      Dartmoor NPA. Absence of data is scored 0.4, not 0.

# ---------------------------------------------------------------------------
# How the weighted variables are combined.
#   weighted_mean      - arithmetic. Forgiving: a strength offsets a weakness.
#   weighted_geometric - multiplicative. Limiting-factor behaviour: any variable
#                        near zero drags the whole score down, which is arguably
#                        the truer model of a species this habitat-specific.
# ---------------------------------------------------------------------------
scoring:
  method: weighted_mean
  # Applied after combination, to spread the top of the distribution out for
  # ranking. 1.0 = no change. Purely cosmetic; does not alter the ranking order.
  gamma: 1.0

calibration:
  elevation:
    derive_from_sites: true
    # Plateau = observed range at the calibration sites, widened by `pad_m`;
    # shoulders extend a further `taper_m`. Generous, because two points are
    # not a distribution.
    pad_m: 50.0
    taper_m: 150.0
    # Never score above this as suitable: c.500 m is the documented British
    # ceiling, and Dartmoor's high ground is blanket bog plateau, not flush.
    hard_max_m: 560.0
  # The calibration sites should land clearly above the moor-wide average. If
  # the best of them falls below this percentile of the scored area, the run
  # warns loudly rather than quietly producing a map you should not trust.
  min_expected_percentile: 90.0

candidates:
  count: 50
  # Exclude ground within this distance of a known site, so the shortlist
  # surfaces new places rather than restating what is already recorded.
  exclusion_buffer_m: 500.0
  # A record known only to a coarse square cannot sensibly exclude that whole
  # square. Records less precise than this are flagged in the output instead.
  max_record_precision_for_exclusion_m: 1000.0
  # Minimum separation between shortlisted candidates, so the table is 50
  # distinct places and not 50 adjacent pixels of one flush.
  min_separation_m: 250.0
  # Candidates below this score are not listed however short the table ends up.
  min_score: 0.5
  # Trapezoid plateaus mean many cells score identically and legitimately. Among
  # tied cells, prefer the one embedded in the widest block of suitable ground:
  # a coherent flush system is a better survey target than an isolated pixel.
  # `patch_mean` or `none`. This changes the ORDER of the shortlist only - it
  # never alters the suitability raster.
  tie_break: patch_mean
  patch_radius_m: 100.0

# ---------------------------------------------------------------------------
# Data sources. `auto` layers can be fetched by `python -m bogorchid acquire`;
# `manual` layers need a licence click-through or a portal download, so the
# pipeline tells you exactly what to put where instead of pretending.
# ---------------------------------------------------------------------------
sources:
  boundary:
    mode: auto
    kind: arcgis_featureserver
    url: "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/National_Parks_England/FeatureServer/0"
    where: "NAME LIKE '%Dartmoor%'"
    filename: "dartmoor_boundary.gpkg"
    licence: "OGL - Natural England"
    notes: "Falls back to project.study_area_bbox if unavailable."

  priority_habitat:
    mode: auto
    kind: arcgis_featureserver
    url: "https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/Priority_Habitats_Inventory_England/FeatureServer/0"
    filename: "priority_habitats.gpkg"
    licence: "OGL - Natural England"
    notes: >
      Queried by bounding box and paged. Verify the layer index and the main
      habitat field name with `preflight --probe`; Natural England renumber
      these services from time to time.

  dtm:
    mode: manual
    filename: "dtm.tif"
    portal: "https://environment.data.gov.uk/survey"
    licence: "OGL - Environment Agency"
    notes: >
      LIDAR Composite DTM, 1 m (2 m where 1 m is unavailable), 5 km tiles.
      Download the tiles covering the study area, then either place a single
      mosaicked GeoTIFF here or drop the tiles in data/raw/dtm_tiles/ and let
      `acquire` mosaic them. 10 m Composite DTM is an acceptable fallback and
      is a single small download, but the flush-scale terrain signal this model
      depends on is much weaker at 10 m.

  peat:
    mode: manual
    filename: "peat_depth.tif"
    portal: "https://england-peat-map-portal-ncea.hub.arcgis.com/"
    licence: "OGL - Natural England (England Peat Map, NERR149, 2025)"
    notes: >
      Two layers are needed: peaty soil depth (-> peat_depth.tif) and the
      vegetation map from which the Sphagnum-dominated class is taken
      (-> peat_vegetation.tif). Downloaded as an ESRI File Geodatabase; export
      the rasters to GeoTIFF. Record which vegetation class codes count as
      Sphagnum-dominated in `layers.sphagnum_classes` below.

  peat_vegetation:
    mode: manual
    filename: "peat_vegetation.tif"
    portal: "https://england-peat-map-portal-ncea.hub.arcgis.com/"
    licence: "OGL - Natural England"
    notes: "See `peat` above."

  rivers:
    mode: manual
    filename: "os_open_rivers.gpkg"
    portal: "https://osdatahub.os.uk/downloads/open/OpenRivers"
    licence: "OGL - Ordnance Survey"
    notes: "OS Open Rivers, watercourse links. Free but behind a download form."

  geology:
    mode: manual
    filename: "bgs_bedrock.gpkg"
    portal: "https://www.bgs.ac.uk/datasets/bgs-geology-625k-digmapgb-625/"
    licence: "BGS OpenGeoscience - check licence terms for your use"
    optional: true
    notes: >
      Optional. If absent the geology variable is dropped and the remaining
      weights are renormalised - which on Dartmoor granite costs almost nothing.

  nvc:
    mode: manual
    filename: "nvc_communities.gpkg"
    portal: "Enquire: Natural England / Dartmoor National Park Authority"
    licence: "By agreement"
    optional: true
    notes: "Not confirmed to exist in accessible form. Ask before assuming."

# ---------------------------------------------------------------------------
# Layer-specific decoding. These are placeholders that MUST be checked against
# the real data before the output is trusted - `preflight` prints the distinct
# values it finds in each categorical raster to help you fill them in.
# ---------------------------------------------------------------------------
layers:
  # Multiply the peat depth raster by this to get centimetres. Check the units
  # of the layer you downloaded - the hard filter threshold is in cm.
  peat_depth_scale_to_cm: 1.0

  # England Peat Map vegetation class codes counting as Sphagnum-dominated.
  sphagnum_classes: []       # e.g. [3, 7] - MUST be set from the real raster
  # BGS LEX_RCS / RCS_D lithology strings mapped onto the base-richness classes
  # used by the geology curve. Matched case-insensitively as substrings.
  base_richness:
    acidic: ["granite", "sandstone", "gritstone", "quartzite", "peat", "rhyolite"]
    intermediate: ["slate", "mudstone", "siltstone", "shale", "schist"]
    base_rich:
      - "limestone"
      - "calcareous"
      - "calc-silicate"   # Dartmoor's metamorphic aureole - the realistic case here
      - "skarn"
      - "dolomite"
      - "chalk"
      - "basalt"
      - "tuff"
